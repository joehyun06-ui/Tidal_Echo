name: Render pinned public health observation offline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_READONLY_HEALTH_GET_EXPLICITLY_APPROVED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Prove health and readiness GET stays OFF unless locally approved
        run: python -m unittest backend.tests._render_public_health_readonly_worker -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RENDER_READONLY_HEALTH_GET_EXPLICITLY_APPROVED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove health and readiness GET stays OFF unless locally approved
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest backend.tests._render_public_health_readonly_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
