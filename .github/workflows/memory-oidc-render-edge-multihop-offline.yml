name: Render Cloudflare multihop ingress provenance offline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_OIDC_TRUSTED_PROXY_REVIEW_ENABLED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Real Uvicorn ASGI and synthetic Render Cloudflare hop cases
        run: python -m unittest backend.tests._memory_oidc_render_edge_chain_worker -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_OIDC_TRUSTED_PROXY_REVIEW_ENABLED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real Uvicorn ASGI and synthetic Render Cloudflare hop cases
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest backend.tests._memory_oidc_render_edge_chain_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
