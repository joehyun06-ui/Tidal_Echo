name: Render Stage41 synthetic SQLite restore OFFLINE

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-wal-recovery:
    name: "synthetic SQLite recovery (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TELEGRAM_BOT_TOKEN: ""
      RENDER_API_KEY: ""
      OPENAI_API_KEY: ""
      KELIVO_API_KEY: ""
      RENDER_OPERATOR_READONLY_GET_EXPLICITLY_APPROVED: "false"
      RENDER_READONLY_HEALTH_GET_EXPLICITLY_APPROVED: "false"
      GUITING_LEDGER_MODE: "disabled"
      CODEX_CONTROL_ENABLED: "false"
      MEMORY_HYBRID_RETRIEVAL_ACTIVE_ENABLED: "false"
    steps:
      - name: Checkout code without persisting GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies only
        run: python -m pip install -r backend/requirements-test.txt

      - name: Recover exclusively synthetic SQLite database in temporary directory
        run: python -m unittest backend.tests._render_synthetic_sqlite_restore_worker -v

      - name: Compile synthetic worker
        run: python -m compileall -q backend/tests/_render_synthetic_sqlite_restore_worker.py

      - name: Assert no credentials or runtime activation
        shell: python
        run: |
          import os
          for key in ("TELEGRAM_BOT_TOKEN", "RENDER_API_KEY", "OPENAI_API_KEY", "KELIVO_API_KEY"):
              assert not os.environ[key]
          assert os.environ["RENDER_OPERATOR_READONLY_GET_EXPLICITLY_APPROVED"] == "false"
          assert os.environ["RENDER_READONLY_HEALTH_GET_EXPLICITLY_APPROVED"] == "false"
          assert os.environ["GUITING_LEDGER_MODE"] == "disabled"
          assert os.environ["CODEX_CONTROL_ENABLED"] == "false"
          assert os.environ["MEMORY_HYBRID_RETRIEVAL_ACTIVE_ENABLED"] == "false"
