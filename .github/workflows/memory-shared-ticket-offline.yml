name: Shared confirmation tickets offline acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_TRUSTED_AUTH_EPOCH_ENABLED: "false"
      MEMORY_SHARED_CONFIRMATION_TICKETS_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Synthetic shared ticket tests
        run: python -m unittest backend.tests._memory_shared_ticket_worker -v

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_TRUSTED_AUTH_EPOCH_ENABLED: "false"
      MEMORY_SHARED_CONFIRMATION_TICKETS_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synthetic shared ticket tests
        shell: pwsh
        run: |
          python -m unittest backend.tests._memory_shared_ticket_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
