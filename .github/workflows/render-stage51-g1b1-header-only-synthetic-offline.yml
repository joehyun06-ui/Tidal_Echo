name: Render Stage51 G1B1 HEADER ONLY synthetic offline privacy gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-g1b1:
    name: "Stage51 G1B1 fake-file header safety (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GUITING_STAGE51_SYNTHETIC_ONLY: "true"
      TELEGRAM_BOT_TOKEN: ""
      OPENAI_API_KEY: ""
      RENDER_API_KEY: ""
      LLM_API_KEY: ""
      GUITING_LEDGER_MODE: disabled
      CODEX_GENERATION_ENABLED: "false"
      CODEX_CONTROL_ENABLED: "false"
      TELEGRAM_ENABLED: "false"
      MEMORY_CORE_ENABLED: "false"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fake data only - never production
        run: python -m unittest backend.tests._render_stage51_g1b1_header_readonly_worker -v
      - name: Compile only
        run: python -m compileall -q scripts/render_stage51_g1b1_header_readonly.py backend/tests/_render_stage51_g1b1_header_readonly_worker.py
