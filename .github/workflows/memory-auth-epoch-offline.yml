name: Memory auth epoch offline acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  epoch-linux:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      MEMORY_TRUSTED_AUTH_EPOCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify synthetic auth epoch lifecycle and confirmation binding
        run: python -m unittest backend.tests._memory_auth_epoch_worker -v

  epoch-windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      MEMORY_TRUSTED_AUTH_EPOCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify synthetic auth epoch lifecycle and confirmation binding
        shell: pwsh
        run: |
          python -m unittest backend.tests._memory_auth_epoch_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
