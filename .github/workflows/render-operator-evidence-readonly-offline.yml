name: Render operator read-only evidence OFFLINE

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_OPERATOR_READONLY_GET_EXPLICITLY_APPROVED: "false"
      TELEGRAM_BOT_TOKEN: ""
      RENDER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run no-network operator evidence safety tests
        run: python -m unittest backend.tests._render_operator_evidence_readonly_worker -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RENDER_OPERATOR_READONLY_GET_EXPLICITLY_APPROVED: "false"
      TELEGRAM_BOT_TOKEN: ""
      RENDER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run no-network operator evidence safety tests
        shell: pwsh
        run: |
          python -m unittest backend.tests._render_operator_evidence_readonly_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
