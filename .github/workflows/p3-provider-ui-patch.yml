name: P3 Provider UI Patch

on:
  push:
    branches:
      - feat/p3-provider-ui

permissions:
  contents: write

concurrency:
  group: p3-provider-ui-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-provider-ui
          fetch-depth: 0

      - name: Patch provider-aware Web session UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"patch anchor count {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '<div class="session-title">API 窗口</div>',
              '<div class="session-title">聊天窗口</div>',
          )

          replace_once(
              'let apiSessions = [];\nlet activeApiSession = LEGACY_SESSION_ID;',
              '''let apiSessions = [];
          let activeApiSession = LEGACY_SESSION_ID;
          let providerCapabilities = {
            default_provider:"api",
            provider_immutable:true,
            providers:{ api:{ create:true }, codex:{ create:false, text_only:true } }
          };''',
          )

          replace_once(
              '''function sessionFiltered(msgs){
            return (msgs || []).filter(msgInActiveSession);
          }
          function renderSessionList(){''',
              '''function sessionFiltered(msgs){
            return (msgs || []).filter(msgInActiveSession);
          }
          function resetProviderCapabilities(){
            providerCapabilities = {
              default_provider:"api",
              provider_immutable:true,
              providers:{ api:{ create:true }, codex:{ create:false, text_only:true } }
            };
          }
          function providerCanCreate(provider){
            return !!(providerCapabilities && providerCapabilities.providers && providerCapabilities.providers[provider] && providerCapabilities.providers[provider].create === true);
          }
          function sessionProvider(sessionId){
            if (!sessionId || sessionId === LEGACY_SESSION_ID) return "api";
            const row = (apiSessions || []).find((s) => s && s.id === sessionId);
            return row && row.provider === "codex" ? "codex" : "api";
          }
          function currentSessionTextOnly(){
            return sessionProvider(activeApiSession) === "codex";
          }
          async function loadProviderCapabilities(){
            resetProviderCapabilities();
            if (USE_MOCK || !secret) return providerCapabilities;
            try{
              const r = await fetch(`${API_BASE}/app/provider/capabilities`, { headers: authHeaders() });
              if (!r.ok) throw new Error("provider capabilities " + r.status);
              const d = await r.json();
              const ws = d && d.web_sessions;
              const providers = ws && ws.providers;
              if (
                !d || d.ok !== true || d.contract_version !== 1 || !ws ||
                ws.default_provider !== "api" || ws.provider_immutable !== true ||
                !providers || !providers.api || providers.api.create !== true ||
                !providers.codex || typeof providers.codex.create !== "boolean" ||
                providers.codex.text_only !== true
              ) throw new Error("provider capabilities invalid");
              providerCapabilities = ws;
            }catch(_){
              resetProviderCapabilities();
            }
            return providerCapabilities;
          }
          function chooseNewSessionProvider(){
            if (!providerCanCreate("codex")) return "api";
            return confirm("新对话使用 Codex？\\n\\n确定：Codex（当前仅文本）\\n取消：API") ? "codex" : "api";
          }
          function renderSessionList(){''',
          )

          replace_once(
              '''function renderSessionList(){
            if (!sessionList) return;
            const rows = [{ id:LEGACY_SESSION_ID, title:"旧主线 / Desktop 记录", since_id:0, virtual:true }].concat(apiSessions || []);''',
              '''function renderSessionList(){
            if (!sessionList) return;
            if (sessionNewBtn) sessionNewBtn.textContent = providerCanCreate("codex") ? "新对话 ▾" : "新对话";
            const rows = [{ id:LEGACY_SESSION_ID, title:"旧主线 / Desktop 记录", since_id:0, virtual:true }].concat(apiSessions || []);''',
          )

          replace_once(
              'const meta = s.virtual ? "没有 api_session 标记的记录" : `since #${s.since_id || 0}`;',
              'const meta = s.virtual ? "没有 api_session 标记的记录" : `${s.provider === "codex" ? "Codex" : "API"} · since #${s.since_id || 0}`;',
          )

          replace_once(
              '''  }catch(_){
              apiSessions = [];
              activeApiSession = LEGACY_SESSION_ID;
            }
            renderSessionList();
          }
          async function activateSession(sessionId, { reload = true } = {}){''',
              '''  }catch(_){
              apiSessions = [];
              activeApiSession = LEGACY_SESSION_ID;
            }
            await loadProviderCapabilities();
            renderSessionList();
          }
          async function activateSession(sessionId, { reload = true } = {}){''',
          )

          replace_once(
              '''async function createNewSession(){
            try{
              const r = await fetch(`${API_BASE}/app/sessions`, {
                method:"POST",
                headers:{ ...authHeaders(), "Content-Type":"application/json" },
                body:JSON.stringify({ title:"新对话", activate:true })
              });
              if (!r.ok) throw new Error("sessions " + r.status);
              const d = await r.json();
              apiSessions = Array.isArray(d.sessions) ? d.sessions : [];
              activeApiSession = d.active_session || (d.created && d.created.id) || LEGACY_SESSION_ID;
              try{ localStorage.setItem(SESSION_PICK_KEY, activeApiSession); }catch(_){}
              resetServerHistoryCache();
              renderSessionList();
              setSessionPopover(false);
              startChat([]);
              showToast("已开启新 API 窗口");
            }catch(_){
              showToast("新对话失败");
            }
          }''',
              '''async function createNewSession(){
            const provider = chooseNewSessionProvider();
            if (!providerCanCreate(provider)){
              showToast(provider === "codex" ? "Codex 当前不可用" : "新对话失败");
              return;
            }
            try{
              const r = await fetch(`${API_BASE}/app/sessions`, {
                method:"POST",
                headers:{ ...authHeaders(), "Content-Type":"application/json" },
                body:JSON.stringify({ title:provider === "codex" ? "Codex 对话" : "新对话", activate:true, provider })
              });
              if (!r.ok) throw new Error("sessions " + r.status);
              const d = await r.json();
              if (!d.created || d.created.provider !== provider) throw new Error("provider mismatch");
              apiSessions = Array.isArray(d.sessions) ? d.sessions : [];
              activeApiSession = d.active_session || d.created.id || LEGACY_SESSION_ID;
              try{ localStorage.setItem(SESSION_PICK_KEY, activeApiSession); }catch(_){}
              resetServerHistoryCache();
              renderSessionList();
              setSessionPopover(false);
              startChat([]);
              showToast(`已开启新 ${provider === "codex" ? "Codex" : "API"} 窗口`);
            }catch(_){
              showToast(provider === "codex" ? "Codex 当前不可用" : "新对话失败");
            }
          }''',
          )

          replace_once(
              '''async function apiSend(text, attachments){
            if (USE_MOCK) return Mock.send(text);
            const payload = { text: text || "" };''',
              '''async function apiSend(text, attachments){
            if (attachments && attachments.length && currentSessionTextOnly()) throw new Error("codex_text_only");
            if (USE_MOCK) return Mock.send(text);
            const payload = { text: text || "" };''',
          )

          replace_once(
              '''async function sendOneFile(file){
            if (!secret) return;
            ensureAudio();''',
              '''async function sendOneFile(file){
            if (!secret) return;
            if (currentSessionTextOnly()){
              showToast("Codex 窗口当前仅支持文本");
              return;
            }
            ensureAudio();''',
          )

          replace_once(
              '''if (sessionBtn) sessionBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            renderSessionList();
            setSessionPopover(sessionPop ? sessionPop.hidden : false);
          });''',
              '''if (sessionBtn) sessionBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await loadProviderCapabilities();
            renderSessionList();
            setSessionPopover(sessionPop ? sessionPop.hidden : false);
          });''',
          )

          path.write_text(text, encoding="utf-8")

      - name: Verify provider UI contract
        shell: python
        run: |
          from pathlib import Path
          text = Path("web/index.html").read_text(encoding="utf-8")
          required = (
              "/app/provider/capabilities",
              "provider_immutable:true",
              "providerCanCreate(\"codex\")",
              "d.created.provider !== provider",
              "activate:true, provider",
              "Codex 窗口当前仅支持文本",
              "s.provider === \"codex\" ? \"Codex\" : \"API\"",
          )
          for needle in required:
              assert needle in text, needle
          assert 'JSON.stringify({ provider:' not in text

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- web/index.html; then
            echo "provider UI already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "feat: add provider-aware Web session UI"
          git push origin HEAD:feat/p3-provider-ui
