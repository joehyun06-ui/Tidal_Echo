name: Lifecycle recovery panel real browsers offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      RECOVERY_BROWSER: ${{ matrix.browser }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing pinned test browser runner
        run: python -m pip install playwright==1.64.1
      - name: Install matching browser and system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test synthetic recovery DOM and lifecycle
        run: python -m unittest backend.tests._lifecycle_recovery_panel_browser -v
