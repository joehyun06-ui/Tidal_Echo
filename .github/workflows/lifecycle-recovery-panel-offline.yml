name: Lifecycle recovery panel real browsers offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      RECOVERY_BROWSER: ${{ matrix.browser }}
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Install existing pinned test browser runner
        run: python -m pip install playwright==1.64.1
      - name: Test synthetic recovery DOM and lifecycle
        run: python -m unittest backend.tests._lifecycle_recovery_panel_browser -v
