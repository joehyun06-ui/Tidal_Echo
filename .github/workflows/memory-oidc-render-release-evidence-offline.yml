name: Render release evidence offline gate review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_OIDC_RENDER_DRIFT_REVIEW_ENABLED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline evidence classifier and real Blueprint consistency
        run: python -m unittest backend.tests._memory_oidc_render_release_evidence_worker -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      MEMORY_OIDC_RENDER_DRIFT_REVIEW_ENABLED: "false"
      MEMORY_OIDC_REAL_NETWORK_EXPLICITLY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline evidence classifier and real Blueprint consistency
        shell: pwsh
        run: |
          python -m unittest backend.tests._memory_oidc_render_release_evidence_worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
