{
  "services": [
    {
      "type": "web",
      "name": "ouou-home-telegram",
      "runtime": "python",
      "plan": "starter",
      "branch": "feat/render-telegram-deployment",
      "autoDeploy": false,
      "buildCommand": "python -m pip install -r backend/requirements.txt",
      "startCommand": "python scripts/render_start.py",
      "healthCheckPath": "/healthz",
      "numInstances": 1,
      "disk": {"name": "ouou-home-data", "mountPath": "/var/data", "sizeGB": 1},
      "envVars": [
        {"key": "PYTHON_VERSION", "value": "3.12.11"},
        {"key": "RENDER_TELEGRAM_MVP", "value": "true"},
        {"key": "RENDER_PERSISTENT_ROOT", "value": "/var/data"},
        {"key": "TELEGRAM_ENABLED", "value": "true"},
        {"key": "TELEGRAM_TEST_MODE", "value": "false"},
        {"key": "TELEGRAM_API_BASE", "value": "https://api.telegram.org"},
        {"key": "TELEGRAM_API_BASE_ALLOWLIST", "value": ""},
        {"key": "TELEGRAM_MAX_TEXT_LENGTH", "value": "4096"},
        {"key": "TELEGRAM_WEBHOOK_MAX_BODY_BYTES", "value": "65536"},
        {"key": "TELEGRAM_WORKER_POLL_SECONDS", "value": "1"},
        {"key": "TELEGRAM_GENERATION_MAX_ATTEMPTS", "value": "2"},
        {"key": "RELAY_DB", "value": "/var/data/relay.db"},
        {"key": "RELAY_UPLOAD_DIR", "value": "/var/data/uploads"},
        {"key": "RELAY_BRAIN_FILE", "value": "/var/data/brain_target"},
        {"key": "RELAY_BRAIN_TARGET", "value": "loop"},
        {"key": "RELAY_PUBLIC_PREFIX", "value": ""},
        {"key": "LOOP_CONFIG", "value": "/var/data/api_loop.config.json"},
        {"key": "RELAY_LOOP_INGEST_URL", "value": "http://127.0.0.1:3020/loop/ingest"},
        {"key": "LOOP_PORT", "value": "3020"},
        {"key": "LOOP_STREAM", "value": "0"},
        {"key": "LOOP_MODEL_TOTAL_TIMEOUT_SECONDS", "value": "120"},
        {"key": "LOOP_CALLBACK_TIMEOUT_SECONDS", "value": "30"},
        {"key": "LOOP_TIMEOUT_SAFETY_MARGIN_SECONDS", "value": "15"},
        {"key": "LOOP_DISPATCH_TIMEOUT_SECONDS", "value": "180"},
        {"key": "SUPERVISOR_LOOP_READY_TIMEOUT_SECONDS", "value": "15"},
        {"key": "SUPERVISOR_SHUTDOWN_GRACE_SECONDS", "value": "10"},
        {"key": "KELIVO_ENABLED", "value": "true"},
        {"key": "KELIVO_CLIENT_ID", "value": "primary-kelivo"},
        {"key": "KELIVO_API_SESSION", "sync": false},
        {"key": "KELIVO_MODEL_ALIAS", "value": "ouou-home"},
        {"key": "KELIVO_GLOBAL_CONCURRENCY", "value": "2"},
        {"key": "KELIVO_CLIENT_CONCURRENCY", "value": "1"},
        {"key": "KELIVO_RATE_LIMIT_PER_MINUTE", "value": "10"},
        {"key": "KELIVO_QUEUE_TIMEOUT_SECONDS", "value": "2"},
        {"key": "KELIVO_DISPATCH_STALE_SECONDS", "value": "300"},
        {"key": "KELIVO_AUTO_IDEMPOTENCY_ENABLED", "value": "false"},
        {"key": "KELIVO_AUTO_IDEMPOTENCY_REPLAY_SECONDS", "value": "300"},
        {"key": "SQLITE_BUSY_TIMEOUT_SECONDS", "value": "30"},
        {"key": "KELIVO_COMPLETION_COMMIT_MARGIN_SECONDS", "value": "15"},
        {"key": "KELIVO_INTERNAL_RESPONSE_MAX_BYTES", "value": "1048576"},
        {"key": "KELIVO_ALLOW_SESSION_REMAP", "value": "false"},
        {"key": "KELIVO_REQUIRE_TELEGRAM_SESSION", "value": "true"},
        {"key": "LOOP_INTERNAL_REQUEST_MAX_BYTES", "value": "1048576"},
        {"key": "LOOP_PROVIDER_RESPONSE_MAX_BYTES", "value": "1048576"},
        {"key": "LOOP_ASSISTANT_MAX_CHARS", "value": "64000"},
        {"key": "TRANSIENT_CONTINUITY_ENABLED", "value": "true"},
        {"key": "RELAY_SECRET", "sync": false},
        {"key": "KELIVO_API_KEY", "sync": false},
        {"key": "TELEGRAM_BOT_TOKEN", "sync": false},
        {"key": "TELEGRAM_WEBHOOK_SECRET", "sync": false},
        {"key": "CHANNEL_AUDIT_HMAC_SECRET", "sync": false},
        {"key": "TELEGRAM_BOT_ACCOUNT_ID", "sync": false},
        {"key": "TELEGRAM_ALLOWED_USER_IDS", "sync": false},
        {"key": "TELEGRAM_ALLOWED_CHAT_IDS", "sync": false},
        {"key": "LLM_API_BASE", "sync": false},
        {"key": "LLM_API_KEY", "sync": false},
        {"key": "LLM_MODEL", "sync": false},
        {"key": "LLM_TEMPERATURE", "value": "0.7"},
        {"key": "LLM_MAX_TOKENS", "value": "2000"}
      ]
    }
  ]
}
